<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام الحسابات الشامل</title>
  <link rel="icon" id="faviconLink" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css?v=44">
  <script>
    (function () {
      try {
        var b = JSON.parse(localStorage.getItem('cachedBranding') || 'null');
        if (b && b.accentColor) document.documentElement.style.setProperty('--accent', b.accentColor);
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body data-theme="dark">

  <!-- ===================== شاشة تحميل أولية (لحد ما نتأكد من حالة الدخول) ===================== -->
  <div id="splashScreen" style="position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:#0d1117;">
    <img src="assets/favicon.svg" alt="" style="width:56px; height:56px; opacity:.9; animation:splashPulse 1.1s ease-in-out infinite;">
  </div>
  <style>@keyframes splashPulse { 0%,100%{opacity:.5; transform:scale(.94);} 50%{opacity:1; transform:scale(1);} }</style>

  <!-- ===================== شاشة تسجيل الدخول ===================== -->
  <div id="loginScreen" style="display:none;">
    <div class="login-orb o1"></div>
    <div class="login-orb o2"></div>
    <div class="login-card">
      <div class="login-logo" id="loginLogo"><img src="assets/favicon.svg" alt="logo"></div>
      <h1 id="loginBrandName">نظام الحسابات</h1>
      <p>سجّل دخولك للمتابعة</p>
      <input type="text" id="loginUsername" placeholder="اليوزرنيم" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="كلمة المرور" autocomplete="current-password">
      <button class="btn-primary-full" id="loginBtn" onclick="handleLogin()">دخول</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- ===================== هيكل التطبيق الرئيسي ===================== -->
  <div id="app" style="display:none;">
    <div id="sidebar">
      <div class="brand">
        <div class="brand-logo" id="sidebarLogoFallback"><img src="assets/favicon.svg" alt="logo" style="width:100%; height:100%; object-fit:cover; border-radius:11px;"></div>
        <img id="sidebarLogo" src="" style="display:none; width:38px; height:38px; border-radius:11px; object-fit:cover;">
        <span id="sidebarBrandName">براندي</span>
      </div>
      <div class="nav-scroll" id="navList"></div>
    </div>
    <div id="sidebarBackdrop" onclick="toggleSidebar()"></div>

    <div id="main">
      <div id="header">
        <div class="header-left">
          <button class="icon-btn" onclick="toggleSidebar()">☰</button>
          <div><div id="pageTitle">الداشبورد</div><div id="pageSubtitle"></div></div>
        </div>
        <div class="header-right">
          <div style="position:relative;">
            <input type="text" id="globalSearchInput" placeholder="🔍 بحث شامل..." oninput="onGlobalSearchInput_(this.value)" style="width:170px; padding:8px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:12.5px;">
            <div id="globalSearchDropdown" style="display:none; position:absolute; top:110%; left:0; width:260px; max-height:340px; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); z-index:200;"></div>
          </div>
          <div class="user-chip">
            <div class="user-avatar" id="userAvatar">؟</div>
            <div><div class="uname" id="userNameChip">—</div><div class="urole" id="userRoleChip">—</div></div>
          </div>
          <button class="icon-btn" onclick="toggleTheme()" id="themeToggleBtn">🌙</button>
          <div style="position:relative;">
            <button class="icon-btn" onclick="toggleNotifications()">🔔<span class="badge" id="notifBadge" style="display:none;">0</span></button>
            <div id="notifDropdown" style="display:none;"></div>
          </div>
        </div>
      </div>
      <div id="content"><div class="empty-state"><span class="emoji">⏳</span><div class="msg">جاري التحميل...</div></div></div>
    </div>
  </div>

  <div id="modalOverlay" onclick="if(event.target===this) closeModal()"><div class="modal-box" id="modalBox"></div></div>
  <div id="toastContainer"></div>

  <script src="js/supabaseClient.js?v=72"></script>
  <script src="js/api.js?v=72"></script>
  <script src="js/app.js?v=72"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
